[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydra-pywr"
version = "0.1.0"
description = "Hydra plugins and library for import and exporting Pywr models"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Hydra Platform", email = "info@hydraplatform.org"}
]
keywords = ["hydra", "pywr", "water", "resources", "modeling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "pyyaml>=5.4",
    "hydra-base>=0.1.20",
    "pywr>=1.0",
    "boto3",
    "pandas==2.3.3",
    # Imported directly by hydra_pywr
    "numpy",
    "scipy",
    "click",
    "python-dateutil",
    "requests",
    "s3fs",
    "pymongo",
]
# Also imported, but not installable from PyPI under these names, so they are not listed here:
#   hydra_client        https://github.com/hydraplatform/hydra-client-python
#                       (NB: the `hydra-client` project on PyPI is an unrelated package)
#   hydra_network_utils https://github.com/hydraplatform/hydra-network-utils
#   pywrparser          https://github.com/umwrg/pywrparser
# Install these from git first; see .github/workflows/tests.yml.

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
]
# Pywr 1.x and 2.x both install as the `pywr` module and cannot share an environment: choose
# one of these extras (e.g. `pip install hydra-pywr[v2]`). The pre-release version in the v2
# specifier lets pip select the Pywr 2 beta without --pre.
v1 = ["pywr>=1.0,<2"]
v2 = ["pywr>=2.0.0b11"]

[project.scripts]
hydra-pywr = "hydra_pywr.cli:start_cli"

[project.urls]
Homepage = "https://github.com/pywr/hydra-pywr"
Documentation = "https://hydraplatform.org"
Repository = "https://github.com/pywr/hydra-pywr"
"Bug Tracker" = "https://github.com/pywr/hydra-pywr/issues"

[tool.setuptools]
packages = ["hydra_pywr", "hydra_pywr.nodes", "hydra_pywr.resultsprocessor"]
include-package-data = true

[tool.setuptools.package-data]
hydra_pywr = ["template_configs/*.json", "*.json"]
